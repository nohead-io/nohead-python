# Weekly, grouped dependency updates: the runtime dependencies (httpx,
# pydantic), the development tools and the CI actions.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # New releases wait a week before a PR (security updates do not), so a
    # compromised or yanked release is usually caught first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
      uv-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      uv-major:
        applies-to: version-updates
        update-types: [major]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
