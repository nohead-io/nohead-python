# Publishes a release when its tag (v1.2.3) is pushed. Tags are pushed by the
# Nohead API repository's "SDK release" workflow, after this commit's smoke
# test passed against the API. PyPI trusted publishing (OIDC, no token) adds
# attestations; CHANGELOG.md's section for the version is the release's notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only a commit on main is released, whoever pushed the tag: the deploy
      # key that pushes tags also syncs the contract.
      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        # Compared with main's commit, not the name, which a tag could shadow.
        run: |
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          status=$(gh api "repos/$REPO/compare/$main...$SHA" --jq .status)
          case "$status" in
            identical | behind) ;;
            *) echo "::error::$TAG ($SHA) is not on main ($status)"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          # No dependency cache for a release: a poisoned cache could reach the package.
          enable-cache: false
      - name: Check the version and its notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the pyproject.toml version $version"; exit 1
          fi
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: |
            dist
            notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI's trusted publisher only accepts this environment, which only v* tags can use.
    environment: release
    permissions:
      id-token: write # PyPI trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" -R "$REPO" --verify-tag --title "$TAG" --notes-file notes.md dist/*
