[project]
name = "nohead"
version = "0.3.0"
description = "Official Python SDK for the Nohead API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nohead", email = "hello@nohead.io" }]
keywords = ["nohead", "cms", "headless", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.urls]
Homepage = "https://nohead.io"
Repository = "https://github.com/nohead-io/nohead-python"
Issues = "https://github.com/nohead-io/nohead-python/issues"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.16", "pyright>=1.1.414"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nohead"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/nohead/_generated/*" = ["E501"]
"src/nohead/models.py" = ["E501", "RUF001", "RUF002"]
"src/nohead/params.py" = ["E501", "RUF001", "RUF002"]

[tool.pyright]
include = ["src", "tests", "scripts", "smoke"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
